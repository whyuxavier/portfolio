<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфоліо проєктів — whyuxavier</title>
    <!-- Modern SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2318181b'/><text x='50%' y='65%' font-family='Inter, sans-serif' font-weight='800' font-size='55' fill='%23ffffff' text-anchor='middle'>W</text><circle cx='76' cy='24' r='8' fill='%2310b981'/></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcfcfc;
            color: #18181b;
        }

        .glass-header {
            background: rgba(252, 252, 252, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .clean-card {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clean-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.06);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fcfcfc;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-zinc-900 selection:text-white">

    <!-- HEADER / NAVIGATION -->
    <header class="sticky top-0 z-40 glass-header border-b border-zinc-200/80 transition-colors">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo / Title -->
            <a href="#" class="flex items-center gap-2.5 group">
                <div class="w-7 h-7 rounded-md bg-zinc-900 flex items-center justify-center text-white font-bold text-xs group-hover:bg-zinc-800 transition-colors">
                    W
                </div>
                <span class="font-semibold tracking-tight text-zinc-900 text-base">
                    whyuxavier
                </span>
            </a>

            <!-- Info Button [i] ONLY -->
            <button id="infoBtn" aria-label="Інформація про автора"
                    class="w-8 h-8 rounded-full bg-zinc-100 hover:bg-zinc-200/80 border border-zinc-200/80 flex items-center justify-center text-zinc-700 hover:text-zinc-900 transition-all font-serif italic text-sm font-bold shadow-sm">
                i
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        
        <!-- Controls: Category Filters & Search Input -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <!-- Filter Pills -->
            <div class="flex flex-wrap items-center gap-1.5" id="filterContainer">
                <button data-filter="all" class="filter-btn active px-3 py-1.5 text-xs font-medium rounded-full bg-zinc-900 text-white transition-all shadow-sm">
                    Усі (<span id="count-all">0</span>)
                </button>
                <button data-filter="Education" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-full bg-zinc-100 text-zinc-600 hover:bg-zinc-200/70 hover:text-zinc-900 transition-all">
                    Освіта (<span id="count-edu">0</span>)
                </button>
                <button data-filter="Tool" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-full bg-zinc-100 text-zinc-600 hover:bg-zinc-200/70 hover:text-zinc-900 transition-all">
                    Інструменти (<span id="count-tools">0</span>)
                </button>
                <button data-filter="Game" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-full bg-zinc-100 text-zinc-600 hover:bg-zinc-200/70 hover:text-zinc-900 transition-all">
                    Ігри (<span id="count-games">0</span>)
                </button>
                <button data-filter="Telegram" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-full bg-zinc-100 text-zinc-600 hover:bg-zinc-200/70 hover:text-zinc-900 transition-all">
                    Telegram (<span id="count-tg">0</span>)
                </button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-56">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Пошук..." 
                       class="w-full bg-zinc-100/80 border border-zinc-200 text-zinc-800 placeholder-zinc-400 text-xs rounded-full pl-8 pr-3 py-1.5 focus:outline-none focus:bg-white focus:border-zinc-400 transition-all">
            </div>
        </div>

        <!-- PROJECTS GRID -->
        <div id="projectsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards populated dynamically via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="w-10 h-10 rounded-full bg-zinc-100 border border-zinc-200 flex items-center justify-center mx-auto text-zinc-400 mb-2">
                <i class="fa-solid fa-folder-open text-sm"></i>
            </div>
            <h3 class="text-zinc-700 font-medium text-sm mb-0.5">Нічого не знайдено</h3>
            <p class="text-zinc-400 text-xs">Спробуйте змінити критерії пошуку.</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-zinc-200/70 py-6 bg-zinc-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left flex flex-col sm:flex-row items-center justify-between gap-2">
            <p class="text-xs text-zinc-400">
                &copy; <span id="year"></span> whyuxavier. Всі розробки.
            </p>
        </div>
    </footer>

    <!-- INFO MODAL [i] -->
    <div id="infoModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div id="modalContent" class="bg-white border border-zinc-200 rounded-2xl max-w-sm w-full p-6 shadow-xl transform scale-95 transition-transform duration-200 relative">
            
            <!-- Close Button -->
            <button id="closeModal" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-zinc-100 hover:bg-zinc-200 text-zinc-500 hover:text-zinc-900 flex items-center justify-center transition-all text-xs">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Modal Header -->
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-zinc-900 text-white font-bold text-base flex items-center justify-center">
                    W
                </div>
                <div>
                    <h3 class="text-base font-bold text-zinc-900 tracking-tight">whyuxavier</h3>
                    <p class="text-xs text-zinc-400">Веб-розробки & Проєкти</p>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="space-y-3 text-xs text-zinc-600 leading-relaxed border-t border-zinc-100 pt-3">
                <p>
                    Персональна колекція інтерактивних навчальних квестів, корисних інструментів, телеграм-ботів та ігор.
                </p>

                <!-- Single GitHub Direct Link -->
                <div class="pt-2">
                    <a href="https://github.com/whyuxavier" target="_blank" rel="noopener noreferrer"
                       class="flex items-center justify-between w-full px-4 py-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white font-medium transition-all group">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-brands fa-github text-base"></i>
                            <span class="text-xs font-semibold">GitHub Профіль</span>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] text-zinc-400 group-hover:text-white transition-colors"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Project Data Definition
        const projects = [
            {
                id: 'tg-bot',
                title: 'Бот у Telegram',
                url: 'https://t.me/bor_alert',
                description: 'Телеграм-бот сповіщень про тривогу.',
                category: 'Telegram',
                tagText: 'Telegram Bot',
                iconClass: 'fa-paper-plane',
                accentColor: 'from-sky-500/10 to-blue-500/5',
                borderColor: 'hover:border-sky-400',
                badgeBg: 'bg-sky-50 text-sky-600 border-sky-200'
            },
            {
                id: 'informatics_hub',
                title: 'Про інформатику',
                url: 'https://t.me/informatics_hub',
                description: 'Телеграм-канал про інформатику та навчання.',
                category: 'Telegram',
                tagText: 'Telegram Channel',
                iconClass: 'fa-chalkboard-user',
                accentColor: 'from-indigo-500/10 to-blue-500/5',
                borderColor: 'hover:border-indigo-400',
                badgeBg: 'bg-indigo-50 text-indigo-600 border-indigo-200'
            },
            {
                id: 'it-alias',
                title: 'Інформатичний Еліас',
                url: 'https://whyuxavier.github.io/it-alias/',
                description: 'Інтерактивна карткова гра з термінів інформатики.',
                category: 'Game',
                tagText: 'Web Game',
                iconClass: 'fa-gamepad',
                accentColor: 'from-purple-500/10 to-pink-500/5',
                borderColor: 'hover:border-purple-400',
                badgeBg: 'bg-purple-50 text-purple-600 border-purple-200'
            },
            {
                id: 'ai-invaders',
                title: 'AI Invaders',
                url: 'https://whyuxavier.github.io/ai-invaders/',
                description: '8-бітна гра в стилі Space Invaders: ти граєш за Claude і б’єш ChatGPT.',
                category: 'Game',
                tagText: 'Web Game',
                iconClass: 'fa-rocket',
                accentColor: 'from-orange-500/10 to-amber-500/5',
                borderColor: 'hover:border-orange-400',
                badgeBg: 'bg-orange-50 text-orange-600 border-orange-200'
            },
            {
                id: 'pixelka',
                title: 'Піксельний редактор',
                url: 'https://whyuxavier.github.io/pixelka/',
                description: 'Веб-інструмент для малювання піксель-арту.',
                category: 'Tool',
                tagText: 'Web Tool',
                iconClass: 'fa-palette',
                accentColor: 'from-amber-500/10 to-orange-500/5',
                borderColor: 'hover:border-amber-400',
                badgeBg: 'bg-amber-50 text-amber-600 border-amber-200'
            },
            {
                id: 'qr-creator',
                title: 'Генератор QR-кодів',
                url: 'https://whyuxavier.github.io/qr-creator/',
                description: 'Швидке створення та налаштування QR-кодів.',
                category: 'Tool',
                tagText: 'Generator',
                iconClass: 'fa-qrcode',
                accentColor: 'from-emerald-500/10 to-teal-500/5',
                borderColor: 'hover:border-emerald-400',
                badgeBg: 'bg-emerald-50 text-emerald-600 border-emerald-200'
            },
            {
                id: 'cyber-tournament',
                title: 'Сайт для кібертурніру',
                url: 'https://whyuxavier.github.io/cyber-tournament/',
                description: 'Платформа для організації кіберспортивних турнірів.',
                category: 'Game',
                tagText: 'Web Platform',
                iconClass: 'fa-trophy',
                accentColor: 'from-rose-500/10 to-red-500/5',
                borderColor: 'hover:border-rose-400',
                badgeBg: 'bg-rose-50 text-rose-600 border-rose-200'
            },
            {
                id: 'data-analysis-quest',
                title: 'Аналіз даних (10 клас)',
                url: 'https://whyuxavier.github.io/data-analysis-quest/',
                description: 'Інтерактивний тест-квест з аналізу даних.',
                category: 'Education',
                tagText: 'Quest / 10 клас',
                iconClass: 'fa-chart-pie',
                accentColor: 'from-indigo-500/10 to-violet-500/5',
                borderColor: 'hover:border-indigo-400',
                badgeBg: 'bg-indigo-50 text-indigo-600 border-indigo-200'
            },
            {
                id: 'text-document-quest',
                title: 'Текстові документи (9 клас)',
                url: 'https://whyuxavier.github.io/text-document-quest/',
                description: 'Навчальний тест-квест з опрацювання текстів.',
                category: 'Education',
                tagText: 'Quest / 9 клас',
                iconClass: 'fa-file-lines',
                accentColor: 'from-cyan-500/10 to-blue-500/5',
                borderColor: 'hover:border-cyan-400',
                badgeBg: 'bg-cyan-50 text-cyan-600 border-cyan-200'
            },
            {
                id: 'python-quest',
                title: 'Квест Python (8 клас)',
                url: 'https://whyuxavier.github.io/python-quiz/',
                description: 'Інтерактивна програма з Python з рівнями та кодом.',
                category: 'Education',
                tagText: 'Quest / 8 клас',
                iconClass: 'fa-staff-snake',
                accentColor: 'from-emerald-500/10 to-teal-500/5',
                borderColor: 'hover:border-emerald-400',
                badgeBg: 'bg-emerald-50 text-emerald-600 border-emerald-200'
            }
        ];

        // State variables
        let currentFilter = 'all';
        let searchQuery = '';

        // DOM Elements
        const projectsGrid = document.getElementById('projectsGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Render projects
        function renderProjects() {
            projectsGrid.innerHTML = '';

            const filteredProjects = projects.filter(project => {
                const matchesFilter = currentFilter === 'all' || project.category === currentFilter;
                const matchesSearch = project.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      project.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      project.tagText.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesFilter && matchesSearch;
            });

            if (filteredProjects.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                filteredProjects.forEach(project => {
                    const card = document.createElement('a');
                    card.href = project.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.className = `clean-card group rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden transition-all duration-200 hover:no-underline ${project.borderColor}`;

                    card.innerHTML = `
                        <!-- Hover Gradient Effect -->
                        <div class="absolute inset-0 bg-gradient-to-br ${project.accentColor} opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div class="relative z-10">
                            <!-- Icon & External Arrow -->
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-10 h-10 rounded-xl bg-zinc-50 border border-zinc-200 flex items-center justify-center text-zinc-700 group-hover:scale-105 group-hover:bg-white transition-all shadow-sm">
                                    <i class="fa-solid ${project.iconClass} text-base"></i>
                                </div>
                                <span class="text-zinc-300 group-hover:text-zinc-600 transition-colors">
                                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                                </span>
                            </div>

                            <!-- Title -->
                            <h2 class="text-sm font-bold text-zinc-900 mb-1.5 group-hover:text-zinc-950 transition-colors">
                                ${project.title}
                            </h2>

                            <!-- Description -->
                            <p class="text-zinc-500 text-xs leading-relaxed mb-4 font-normal line-clamp-2">
                                ${project.description}
                            </p>
                        </div>

                        <!-- Badge Footer -->
                        <div class="relative z-10 pt-3 border-t border-zinc-100 flex items-center justify-between">
                            <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-medium border ${project.badgeBg}">
                                ${project.tagText}
                            </span>
                            <span class="text-[10px] text-zinc-400 group-hover:text-zinc-700 transition-colors font-medium">
                                Перейти <i class="fa-solid fa-chevron-right text-[8px] ml-0.5"></i>
                            </span>
                        </div>
                    `;

                    projectsGrid.appendChild(card);
                });
            }

            updateCounts();
        }

        // Update counts in filter buttons
        function updateCounts() {
            document.getElementById('count-all').textContent = projects.length;
            document.getElementById('count-edu').textContent = projects.filter(p => p.category === 'Education').length;
            document.getElementById('count-tools').textContent = projects.filter(p => p.category === 'Tool').length;
            document.getElementById('count-games').textContent = projects.filter(p => p.category === 'Game').length;
            document.getElementById('count-tg').textContent = projects.filter(p => p.category === 'Telegram').length;
        }

        // Filter button click handler
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-zinc-900', 'text-white', 'active', 'shadow-sm');
                    b.classList.add('bg-zinc-100', 'text-zinc-600');
                });

                btn.classList.remove('bg-zinc-100', 'text-zinc-600');
                btn.classList.add('bg-zinc-900', 'text-white', 'active', 'shadow-sm');

                currentFilter = btn.dataset.filter;
                renderProjects();
            });
        });

        // Search input handler
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderProjects();
        });

        // MODAL LOGIC
        const infoBtn = document.getElementById('infoBtn');
        const infoModal = document.getElementById('infoModal');
        const modalContent = document.getElementById('modalContent');
        const closeModal = document.getElementById('closeModal');

        function openModal() {
            infoModal.classList.remove('hidden');
            setTimeout(() => {
                infoModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function hideModal() {
            infoModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                infoModal.classList.add('hidden');
            }, 200);
        }

        infoBtn.addEventListener('click', openModal);
        closeModal.addEventListener('click', hideModal);

        // Close modal on backdrop click
        infoModal.addEventListener('click', (e) => {
            if (e.target === infoModal) {
                hideModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !infoModal.classList.contains('hidden')) {
                hideModal();
            }
        });

        // Set Current Year in Footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Initial Render
        renderProjects();
    </script>
</body>
</html>
